# SonarCloud project configuration.
# Replace YOUR_GITHUB_USERNAME below with your actual GitHub username/org
# (the "organization" key in SonarCloud is normally your GitHub username,
# lowercased, once you've created it at sonarcloud.io).

sonar.projectKey=courier-management-system
sonar.organization=shieemster

sonar.sources=.
sonar.exclusions=**/assets/plugin/**,**/js/**,**/css/**,**/scss/**,**/fonts/**,**/*.min.js,**/*.min.css

# PHP-specific: nothing extra required, SonarCloud auto-detects PHP files.
